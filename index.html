<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#101D31" />
    {{CANONICAL}}

    <!-- Open Graph (תמונת שיתוף: להוסיף og:image רק לאחר שבעל האתר יספק תמונה מאושרת) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    {{OG_URL}}
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- פונטים: Heebo (גוף) ו-Frank Ruhl Libre (כותרות), שניהם ברישיון SIL OFL. לפרטיות מרבית אפשר לארח מקומית (ראו README). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="{{CSS}}" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif;color:#f5f0e7">האתר דורש JavaScript. האתר נמצא בהקמה והתשלום עדיין אינו פעיל.</p>
    </noscript>
    <script type="module" src="{{JS}}"></script>
  </body>
</html>
